<figure class="hvid-wrap">
<video id="home-intro" class="hvid" autoplay muted loop playsinline preload="metadata" width="1080" height="1350" poster="/assets/img/homepage-intro-poster-4x5.jpg" aria-label="Richard Cuagdan introduces Mitsubishi sales help in San Jose del Monte (SJDM), Bulacan">
<source src="/assets/video/homepage-intro-4x5.mp4" type="video/mp4">
</video>
<button type="button" class="hvid-sound" aria-controls="home-intro" aria-pressed="false" aria-label="Unmute video"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM16 6.3v1.5a6.5 6.5 0 0 1 0 8.4v1.5a8 8 0 0 0 0-11.4z"/></svg><span class="hvid-lbl">Sound</span></button>
</figure>
<style>
.hero-vid .hvid-wrap{position:relative;margin:0 auto;width:100%;max-width:420px;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:#111;justify-self:center}
.hero-vid .hvid{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#111}
.hero-vid .hvid-sound{position:absolute;top:10px;right:10px;z-index:2;min-height:44px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:rgba(11,11,12,.82);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1}
.hero-vid .hvid-sound:hover,.hero-vid .hvid-sound.is-on{background:var(--red)}
.hero-vid .hvid-sound:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:899px){.hero-vid{padding-bottom:92px}}
@media(max-width:599px){.hero-vid .hvid-sound{top:8px;right:8px;font-size:13px;padding:8px 12px}}
</style>
<script>
(function(){
  var v=document.getElementById("home-intro"), b=document.querySelector(".hvid-sound");
  if(!v||!b)return;
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sync(){
    var on=!v.muted;
    b.setAttribute("aria-pressed", on?"true":"false");
    b.setAttribute("aria-label", on?"Mute video":"Unmute video");
    b.classList.toggle("is-on", on);
    var t=b.querySelector(".hvid-lbl");
    if(t)t.textContent=on?"Mute":"Sound";
  }
  b.addEventListener("click", function(){
    v.muted=!v.muted;
    if(!v.muted && v.paused) v.play().catch(function(){});
    sync();
  });
  sync();
  if(reduce){ v.removeAttribute("autoplay"); v.pause(); }
  else { v.play().catch(function(){}); }
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(ents){
      ents.forEach(function(e){
        if(e.isIntersecting){ if(!reduce) v.play().catch(function(){}); }
        else { v.pause(); }
      });
    },{threshold:0.2});
    io.observe(v);
  }
})();
</script>
